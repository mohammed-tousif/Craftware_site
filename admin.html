<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CraftWare — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#05080f; --navy-2:#0b1120; --cream:#f2ede2; --ink:#0a0d15;
    --sky:#57c2ef; --yellow:#ffcd3c; --line:rgba(242,237,226,0.14);
    --display:"Big Shoulders Display","Inter",sans-serif; --body:"Inter",sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--navy); color:var(--cream); font-family:var(--body); min-height:100vh; }
  h1,h2{ font-family:var(--display); font-weight:900; text-transform:uppercase; margin:0; letter-spacing:.01em; }
  .wrap{ max-width:960px; margin:0 auto; padding:36px 24px 80px; }
  .top{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .dot{ width:9px; height:9px; background:var(--yellow); transform:rotate(45deg); flex-shrink:0; }
  h1{ font-size:clamp(26px,4vw,34px); }
  .sub{ color:rgba(242,237,226,0.55); font-size:14px; margin:8px 0 30px; }

  /* --- password gate --- */
  #gate{ max-width:360px; margin:80px auto; text-align:center; }
  #gate p{ color:rgba(242,237,226,0.6); font-size:14px; margin-bottom:22px; }
  input[type="password"], input[type="text"], input[type="email"], input[type="url"], textarea{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--cream);
    font-family:var(--body); font-size:14.5px; padding:11px 13px; outline:none; border-radius:8px;
  }
  input:focus, textarea:focus{ border-color:var(--sky); }
  textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  button{ font-family:var(--body); cursor:pointer; border:none; }
  .btn{ padding:11px 20px; border-radius:8px; font-weight:700; font-size:13.5px; letter-spacing:.02em; transition:opacity .2s ease, transform .2s ease; }
  .btn:hover{ opacity:.85; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn-primary{ background:var(--yellow); color:var(--ink); }
  .btn-block{ width:100%; margin-top:14px; padding:13px; }
  .btn-approve{ background:rgba(87,194,239,0.16); color:var(--sky); }
  .btn-reject{ background:rgba(255,107,107,0.14); color:#ff8a8a; }
  .btn-pending{ background:rgba(255,255,255,0.08); color:rgba(242,237,226,0.7); }
  .btn-ghost{ background:rgba(255,255,255,0.06); color:var(--cream); }
  #err{ color:#ff8a8a; font-size:13px; margin-top:10px; min-height:16px; }

  /* --- top-level page nav --- */
  .pagenav{ display:flex; gap:8px; margin:26px 0 30px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:20px; }
  .pagenav button{ background:none; color:rgba(242,237,226,0.55); font-size:14px; font-weight:700; padding:8px 4px; border-bottom:2px solid transparent; }
  .pagenav button.active{ color:var(--cream); border-color:var(--yellow); }
  .page{ display:none; }
  .page.active{ display:block; }

  /* --- sub tabs (status filters) --- */
  .tabs{ display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
  .tab{ background:none; border:1px solid var(--line); color:rgba(242,237,226,0.65); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; }
  .tab.active{ border-color:var(--sky); color:var(--cream); background:rgba(87,194,239,0.1); }

  /* --- cards (reviews + works) --- */
  #reviewList, #workList{ display:flex; flex-direction:column; gap:14px; }
  .card{
    background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:14px; padding:22px;
    display:flex; flex-direction:column; gap:12px;
  }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .who b{ display:block; font-size:15px; }
  .who span{ display:block; font-size:12.5px; color:rgba(242,237,226,0.5); margin-top:2px; }
  .stars{ color:var(--yellow); font-size:14px; letter-spacing:2px; white-space:nowrap; }
  .quote{ font-size:14.5px; line-height:1.6; color:rgba(242,237,226,0.9); }
  .meta{ font-size:11.5px; color:rgba(242,237,226,0.4); }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .empty{ text-align:center; color:rgba(242,237,226,0.4); font-size:14px; padding:60px 0; }
  .status-pill{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 10px; border-radius:999px; }
  .status-pending{ background:rgba(255,205,60,0.16); color:var(--yellow); }
  .status-approved{ background:rgba(87,194,239,0.16); color:var(--sky); }
  .status-rejected{ background:rgba(255,107,107,0.14); color:#ff8a8a; }

  /* --- works form --- */
  .form-box{ background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:28px; }
  .form-box h2{ font-size:16px; margin-bottom:16px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11.5px; letter-spacing:.04em; color:rgba(242,237,226,0.5); margin-bottom:7px; text-transform:uppercase; }
  .field .hint{ text-transform:none; color:rgba(242,237,226,0.35); font-size:11px; margin-top:5px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .checks{ display:flex; gap:16px; flex-wrap:wrap; }
  .checks label{ display:flex; align-items:center; gap:7px; font-size:13px; text-transform:none; color:var(--cream); cursor:pointer; }
  .checks input{ width:auto; }
  .work-thumb{ width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:8px; background:rgba(255,255,255,0.06); margin-bottom:12px; }
  .form-actions{ display:flex; gap:10px; }
  .form-actions .btn{ flex:1; }

  @media (max-width:600px){ .row2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="gate" class="wrap">
  <div class="top" style="justify-content:center;"><span class="dot"></span><h1 style="font-size:22px;">CraftWare Admin</h1></div>
  <p>Enter the admin password to continue.</p>
  <input type="password" id="pwInput" placeholder="Admin password" autofocus>
  <button class="btn btn-primary btn-block" id="pwSubmit">Unlock</button>
  <div id="err"></div>
</div>

<div class="wrap" id="panel" style="display:none;">
  <div class="top"><span class="dot"></span><h1>CraftWare Admin</h1></div>
  <p class="sub">Reviews, work items and contact info shown on the live site.</p>

  <div class="pagenav">
    <button class="active" data-page="reviews">Reviews</button>
    <button data-page="works">Work / Portfolio</button>
    <button data-page="settings">Contact Info</button>
  </div>

  <!-- ===== REVIEWS ===== -->
  <div class="page active" id="page-reviews">
    <div class="tabs">
      <button class="tab active" data-status="pending">Pending</button>
      <button class="tab" data-status="approved">Approved</button>
      <button class="tab" data-status="rejected">Rejected</button>
      <button class="tab" data-status="all">All</button>
    </div>
    <div id="reviewList"></div>
  </div>

  <!-- ===== WORKS ===== -->
  <div class="page" id="page-works">
    <div class="form-box">
      <h2 id="workFormTitle">Add a work item</h2>
      <div class="field">
        <label for="wTitle">Title</label>
        <input type="text" id="wTitle" placeholder="e.g. Quba International" maxlength="120">
      </div>
      <div class="field">
        <label for="wDesc">Description</label>
        <textarea id="wDesc" maxlength="800" placeholder="What did we build / run for them?"></textarea>
      </div>
      <div class="field">
        <label>Category (used for the Work-page filters)</label>
        <div class="checks">
          <label><input type="checkbox" value="web" class="wCat"> Web Development</label>
          <label><input type="checkbox" value="branding" class="wCat"> Branding</label>
          <label><input type="checkbox" value="marketing" class="wCat"> Marketing</label>
        </div>
      </div>
      <div class="field">
        <label for="wTags">Tags <span class="hint" style="display:inline;">(comma-separated, shown as pills)</span></label>
        <input type="text" id="wTags" placeholder="Web development, Live project, SEO">
      </div>
      <div class="row2">
        <div class="field">
          <label for="wImage">Image URL <span class="hint" style="display:inline;">(optional)</span></label>
          <input type="url" id="wImage" placeholder="https://…">
        </div>
        <div class="field">
          <label for="wSite">Live site URL <span class="hint" style="display:inline;">(optional)</span></label>
          <input type="url" id="wSite" placeholder="https://…">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="wSaveBtn">Add work item</button>
        <button class="btn btn-ghost" id="wCancelBtn" style="display:none;">Cancel edit</button>
      </div>
      <p class="rv-msg" id="wMsg" style="font-size:13px; margin-top:10px;"></p>
    </div>
    <div id="workList"></div>
  </div>

  <!-- ===== SETTINGS ===== -->
  <div class="page" id="page-settings">
    <div class="form-box">
      <h2>Contact info</h2>
      <p class="sub" style="margin-top:0;">Shown in the Contact section of the live site.</p>
      <div class="field">
        <label for="sEmail">Email</label>
        <input type="email" id="sEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="sPhone">Phone <span class="hint" style="display:inline;">(used for both the Call and WhatsApp link)</span></label>
        <input type="text" id="sPhone" placeholder="+91 87229 73448">
      </div>
      <div class="field">
        <label for="sLocation">Location</label>
        <input type="text" id="sLocation" placeholder="Hubli, Karnataka">
      </div>
      <button class="btn btn-primary" id="sSaveBtn">Save contact info</button>
      <p class="rv-msg" id="sMsg" style="font-size:13px; margin-top:10px;"></p>
    </div>
  </div>
</div>

<script>
  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  const pwInput = document.getElementById('pwInput');
  const pwSubmit = document.getElementById('pwSubmit');
  const errEl = document.getElementById('err');
  let password = sessionStorage.getItem('cw_admin_pw') || '';

  async function callApi(path, opts = {}) {
    const res = await fetch(path + (opts.query || ''), {
      method: opts.method || 'GET',
      headers: {
        'x-admin-password': password,
        ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (res.status === 401) throw new Error('unauthorized');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'request failed');
    return data;
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function fmtDate(iso){
    try { return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }
    catch { return ''; }
  }

  function showGate(message){
    sessionStorage.removeItem('cw_admin_pw');
    password = '';
    panel.style.display = 'none';
    gate.style.display = 'block';
    errEl.textContent = message || '';
    pwInput.value = '';
    pwInput.focus();
  }

  /* ---------------- page switcher ---------------- */
  document.querySelectorAll('.pagenav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pagenav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + btn.dataset.page).classList.add('active');
      if (btn.dataset.page === 'works') loadWorks();
      if (btn.dataset.page === 'settings') loadSettings();
    });
  });

  /* ================= REVIEWS ================= */
  const reviewList = document.getElementById('reviewList');
  const reviewTabs = document.querySelectorAll('#page-reviews .tab');
  let currentReviewStatus = 'pending';

  function stars(n){ return '★'.repeat(n) + '☆'.repeat(5 - n); }

  function renderReviewCard(r){
    const div = document.createElement('div');
    div.className = 'card';
    const showApprove = r.status !== 'approved';
    const showReject = r.status !== 'rejected';
    const showPending = r.status !== 'pending';
    div.innerHTML = `
      <div class="card-top">
        <div class="who"><b>${escapeHtml(r.name)}</b>${r.role ? `<span>${escapeHtml(r.role)}</span>` : ''}</div>
        <div class="stars">${stars(r.rating)}</div>
      </div>
      <p class="quote">"${escapeHtml(r.quote)}"</p>
      <div class="card-top">
        <span class="meta">${fmtDate(r.created_at)} · <span class="status-pill status-${r.status}">${r.status}</span></span>
        <div class="actions">
          ${showApprove ? `<button class="btn btn-approve" data-action="approve" data-id="${r.id}">Approve</button>` : ''}
          ${showReject ? `<button class="btn btn-reject" data-action="reject" data-id="${r.id}">Reject</button>` : ''}
          ${showPending ? `<button class="btn btn-pending" data-action="pending" data-id="${r.id}">Back to pending</button>` : ''}
        </div>
      </div>
    `;
    return div;
  }

  async function loadReviews(){
    reviewList.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const rows = await callApi('/api/reviews-admin', { query: `?status=${currentReviewStatus}` });
      reviewList.innerHTML = '';
      if (!rows.length) { reviewList.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
      rows.forEach(r => reviewList.appendChild(renderReviewCard(r)));
    } catch (e) {
      if (e.message === 'unauthorized') return showGate('Session expired — please re-enter the password.');
      reviewList.innerHTML = '<p class="empty">Could not load reviews. Try again shortly.</p>';
    }
  }

  reviewList.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    btn.disabled = true;
    try {
      await callApi('/api/reviews-admin', { method: 'POST', body: { id: btn.dataset.id, action: btn.dataset.action } });
      loadReviews();
    } catch (e2) {
      btn.disabled = false;
      if (e2.message === 'unauthorized') showGate('Session expired — please re-enter the password.');
    }
  });

  reviewTabs.forEach(t => t.addEventListener('click', () => {
    reviewTabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentReviewStatus = t.dataset.status;
    loadReviews();
  }));

  /* ================= WORKS ================= */
  const workList = document.getElementById('workList');
  const wTitle = document.getElementById('wTitle');
  const wDesc = document.getElementById('wDesc');
  const wTags = document.getElementById('wTags');
  const wImage = document.getElementById('wImage');
  const wSite = document.getElementById('wSite');
  const wCats = document.querySelectorAll('.wCat');
  const wSaveBtn = document.getElementById('wSaveBtn');
  const wCancelBtn = document.getElementById('wCancelBtn');
  const wMsg = document.getElementById('wMsg');
  const workFormTitle = document.getElementById('workFormTitle');
  let editingWorkId = null;
  let worksLoaded = false;

  function resetWorkForm(){
    editingWorkId = null;
    wTitle.value = ''; wDesc.value = ''; wTags.value = ''; wImage.value = ''; wSite.value = '';
    wCats.forEach(c => c.checked = false);
    workFormTitle.textContent = 'Add a work item';
    wSaveBtn.textContent = 'Add work item';
    wCancelBtn.style.display = 'none';
    wMsg.textContent = '';
  }

  function renderWorkCard(w){
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      ${w.image_url ? `<img class="work-thumb" src="${escapeHtml(w.image_url)}" alt="">` : ''}
      <div class="card-top">
        <div class="who"><b>${escapeHtml(w.title)}</b><span>${escapeHtml((w.categories || '').split(' ').join(', '))}</span></div>
      </div>
      <p class="quote">${escapeHtml(w.description)}</p>
      <div class="card-top">
        <span class="meta">${w.tags ? escapeHtml(w.tags) : ''}</span>
        <div class="actions">
          <button class="btn btn-pending" data-edit="${w.id}">Edit</button>
          <button class="btn btn-reject" data-delete="${w.id}">Delete</button>
        </div>
      </div>
    `;
    return div;
  }

  async function loadWorks(){
    workList.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const rows = await callApi('/api/works-admin');
      worksLoaded = true;
      workList.innerHTML = '';
      if (!rows.length) { workList.innerHTML = '<p class="empty">No work items yet.</p>'; return; }
      window.__works = rows;
      rows.forEach(w => workList.appendChild(renderWorkCard(w)));
    } catch (e) {
      if (e.message === 'unauthorized') return showGate('Session expired — please re-enter the password.');
      workList.innerHTML = '<p class="empty">Could not load work items. Try again shortly.</p>';
    }
  }

  workList.addEventListener('click', async (e) => {
    const editBtn = e.target.closest('button[data-edit]');
    const delBtn = e.target.closest('button[data-delete]');
    if (editBtn) {
      const w = (window.__works || []).find(x => x.id === editBtn.dataset.edit);
      if (!w) return;
      editingWorkId = w.id;
      wTitle.value = w.title; wDesc.value = w.description; wTags.value = w.tags || '';
      wImage.value = w.image_url || ''; wSite.value = w.site_url || '';
      const cats = (w.categories || '').split(' ');
      wCats.forEach(c => c.checked = cats.includes(c.value));
      workFormTitle.textContent = 'Edit work item';
      wSaveBtn.textContent = 'Save changes';
      wCancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (delBtn) {
      if (!confirm('Delete this work item? This cannot be undone.')) return;
      delBtn.disabled = true;
      try {
        await callApi('/api/works-admin', { method: 'POST', body: { action: 'delete', id: delBtn.dataset.delete } });
        loadWorks();
      } catch (e2) {
        delBtn.disabled = false;
        if (e2.message === 'unauthorized') showGate('Session expired — please re-enter the password.');
      }
    }
  });

  wCancelBtn.addEventListener('click', resetWorkForm);

  wSaveBtn.addEventListener('click', async () => {
    const title = wTitle.value.trim();
    const description = wDesc.value.trim();
    if (!title || !description) {
      wMsg.textContent = 'Title and description are required.';
      return;
    }
    const categories = Array.from(wCats).filter(c => c.checked).map(c => c.value).join(' ') || 'web';
    const payload = {
      action: editingWorkId ? 'update' : 'create',
      id: editingWorkId || undefined,
      title, description,
      categories,
      tags: wTags.value.trim(),
      image_url: wImage.value.trim(),
      site_url: wSite.value.trim(),
    };
    wSaveBtn.disabled = true;
    wMsg.textContent = '';
    try {
      await callApi('/api/works-admin', { method: 'POST', body: payload });
      resetWorkForm();
      loadWorks();
    } catch (e) {
      wMsg.textContent = e.message === 'unauthorized' ? 'Session expired.' : (e.message || 'Could not save.');
      if (e.message === 'unauthorized') showGate('Session expired — please re-enter the password.');
    } finally {
      wSaveBtn.disabled = false;
    }
  });

  /* ================= SETTINGS ================= */
  const sEmail = document.getElementById('sEmail');
  const sPhone = document.getElementById('sPhone');
  const sLocation = document.getElementById('sLocation');
  const sSaveBtn = document.getElementById('sSaveBtn');
  const sMsg = document.getElementById('sMsg');
  let settingsLoaded = false;

  async function loadSettings(){
    if (settingsLoaded) return;
    try {
      const s = await callApi('/api/settings-admin');
      sEmail.value = s.email || '';
      sPhone.value = s.phone || '';
      sLocation.value = s.location || '';
      settingsLoaded = true;
    } catch (e) {
      if (e.message === 'unauthorized') return showGate('Session expired — please re-enter the password.');
      sMsg.textContent = 'Could not load current settings.';
    }
  }

  sSaveBtn.addEventListener('click', async () => {
    sSaveBtn.disabled = true;
    sMsg.textContent = '';
    try {
      await callApi('/api/settings-admin', {
        method: 'POST',
        body: { email: sEmail.value.trim(), phone: sPhone.value.trim(), location: sLocation.value.trim() },
      });
      sMsg.textContent = 'Saved.';
      sMsg.style.color = 'var(--sky)';
    } catch (e) {
      sMsg.textContent = e.message === 'unauthorized' ? 'Session expired.' : (e.message || 'Could not save.');
      sMsg.style.color = '#ff8a8a';
      if (e.message === 'unauthorized') showGate('Session expired — please re-enter the password.');
    } finally {
      sSaveBtn.disabled = false;
    }
  });

  /* ================= gate ================= */
  function showPanel(){
    gate.style.display = 'none';
    panel.style.display = 'block';
    loadReviews();
  }

  async function tryUnlock(){
    const candidate = pwInput.value;
    if (!candidate) return;
    errEl.textContent = '';
    pwSubmit.disabled = true;
    password = candidate;
    try {
      await callApi('/api/reviews-admin', { query: '?status=pending' });
      sessionStorage.setItem('cw_admin_pw', password);
      showPanel();
    } catch (e) {
      errEl.textContent = 'Wrong password.';
      password = '';
    } finally {
      pwSubmit.disabled = false;
    }
  }

  pwSubmit.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

  if (password) {
    callApi('/api/reviews-admin', { query: '?status=pending' }).then(showPanel).catch(() => { password = ''; sessionStorage.removeItem('cw_admin_pw'); });
  }
</script>
</body>
</html>
